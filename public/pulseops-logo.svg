<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="100%" height="100%">
  <defs>
    <!-- Background Glass Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1427" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#070a14" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#a855f7;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#a855f7;#38bdf8;#6366f1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#38bdf8;#818cf8;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Bolt Electric Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#60a5fa"/>
      <stop offset="80%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- ECG Pulse Gradient -->
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="90%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="pulseTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <linearGradient id="opsTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="auraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes heartbeat {
        0%, 100% { transform: scale(1); opacity: 0.88; }
        15% { transform: scale(1.045); opacity: 1; filter: drop-shadow(0 0 16px rgba(56,189,248,0.7)); }
        25% { transform: scale(0.985); opacity: 0.9; }
        35% { transform: scale(1.025); opacity: 0.98; }
        50% { transform: scale(1); opacity: 0.88; }
      }

      @keyframes ecgTravel {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }

      @keyframes auraBreath {
        0%, 100% { transform: scale(0.92); opacity: 0.45; }
        20% { transform: scale(1.15); opacity: 0.85; }
        40% { transform: scale(0.96); opacity: 0.55; }
      }

      @keyframes boltJolt {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(56,189,248,0.6)); }
        18% { transform: scale(1.06) rotate(-1deg); filter: drop-shadow(0 0 24px rgba(168,85,247,0.95)) drop-shadow(0 0 8px #ffffff); }
        32% { transform: scale(0.99) rotate(0.5deg); }
        42% { transform: scale(1.03); filter: drop-shadow(0 0 14px rgba(56,189,248,0.8)); }
        55% { transform: scale(1); }
      }

      @keyframes ringSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes beaconBlink {
        0%, 100% { opacity: 0.4; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      .aura-circle {
        transform-origin: 100px 100px;
        animation: auraBreath 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .emblem-group {
        transform-origin: 100px 100px;
        animation: heartbeat 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .bolt-shape {
        transform-origin: 100px 96px;
        animation: boltJolt 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .orbit-ring {
        transform-origin: 100px 100px;
        animation: ringSpin 18s linear infinite;
      }

      .ecg-path {
        stroke-dasharray: 200;
        animation: ecgTravel 3.6s linear infinite;
      }

      .beacon-dot {
        transform-origin: 672px 147px;
        animation: beaconBlink 1.6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Ambient Radiant Glow Behind Shield -->
  <circle class="aura-circle" cx="100" cy="100" r="70" fill="#38bdf8" filter="url(#auraGlow)"/>
  <circle class="aura-circle" cx="100" cy="100" r="55" fill="#818cf8" filter="url(#auraGlow)"/>

  <!-- EMBLEM BADGE -->
  <g class="emblem-group">
    <!-- Outer Cybernetic Tech Orbit Ring -->
    <circle class="orbit-ring" cx="100" cy="100" r="82" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-dasharray="8 14 32 14" opacity="0.65"/>
    <circle class="orbit-ring" cx="100" cy="100" r="87" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 28 6 18" opacity="0.35" style="animation-duration: 22s; animation-direction: reverse;"/>

    <!-- Shield Hexagon/Squircle Base -->
    <rect x="25" y="25" width="150" height="150" rx="34" fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#subtleGlow)"/>

    <!-- Subdued Grid pattern inside shield -->
    <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
      <line x1="25" y1="70" x2="175" y2="70"/>
      <line x1="25" y1="100" x2="175" y2="100"/>
      <line x1="25" y1="130" x2="175" y2="130"/>
      <line x1="70" y1="25" x2="70" y2="175"/>
      <line x1="100" y1="25" x2="100" y2="175"/>
      <line x1="130" y1="25" x2="130" y2="175"/>
    </g>

    <!-- Underlying ECG Pulse Wave Across Center -->
    <path class="ecg-path" d="M 32 104 L 56 104 L 66 90 L 76 118 L 84 82 L 94 126 L 102 104 L 120 104 L 128 92 L 138 104 L 168 104"
          fill="none" stroke="url(#ecgGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)"/>

    <!-- Main Electric Lightning Bolt (⚡) with Gradient & Glow -->
    <g class="bolt-shape">
      <!-- Outer bolt glow silhouette -->
      <polygon points="106,38 60,105 92,105 82,162 144,89 110,89"
               fill="url(#boltGrad)" filter="url(#neonGlow)" opacity="0.7"/>

      <!-- Sharp core bolt -->
      <polygon points="106,40 64,103 94,103 85,158 140,91 108,91"
               fill="url(#boltGrad)"/>

      <!-- Hot white energy core highlight -->
      <polygon points="105,44 74,101 95,101 88,145 132,93 107,93"
               fill="#ffffff" opacity="0.75" style="mix-blend-mode: overlay;"/>
    </g>

    <!-- Corner Optical Tech Accents -->
    <circle cx="42" cy="42" r="2.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="158" cy="42" r="2.5" fill="#a855f7" opacity="0.8"/>
    <circle cx="42" cy="158" r="2.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="158" cy="158" r="2.5" fill="#a855f7" opacity="0.8"/>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(205, 0)">
    <!-- Main Brand Name: PULSE OPS -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'JetBrains Mono', sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5" fill="url(#pulseTextGrad)">PULSE<tspan dx="12" fill="url(#opsTextGrad)" filter="url(#subtleGlow)">OPS</tspan></text>

    <!-- Edition Pill Badge -->
    <g transform="translate(425, 68)">
      <rect x="0" y="0" width="108" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9"/>
      <text x="54" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="1.2" text-anchor="middle">PYTHON</text>
    </g>

    <!-- Subtitle Meta Line -->
    <text x="3" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="600" font-size="13.5" letter-spacing="3.8" fill="#94a3b8">REAL-TIME LINUX INFRASTRUCTURE FLEET</text>

    <!-- Live Status Indicator -->
    <g transform="translate(0, 0)">
      <circle class="beacon-dot" cx="442" cy="144" r="4" fill="#22c55e" filter="url(#subtleGlow)"/>
      <text x="452" y="148" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22c55e" letter-spacing="1">FLEET ONLINE</text>
    </g>
  </g>
</svg>